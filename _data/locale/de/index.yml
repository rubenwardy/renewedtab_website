sfeatures.backgrounds.desc: Sehe ein zufälliges Hintergrundbild alle 15 Minuten.
  Sie können auch eine solide Farbe, eine Unsplash Kollektion, eine RSS/Atom 
  feed, oder laden Sie ihr eigenes Hintergrundbild hoch.
sfeatures.customisable.desc: Wechseln Sie Ihr Hintergrundbild, das Thema, und 
  konfigurieren Sie jedes Widget unabhängig.
sfeatures.locale.desc: "Unterstützung für Französisch, Spanisch, Italienisch, Portugiesisch
  und Türkisch. Übersetzungen sind<a\n    href=\"https://renewedtab.com/translations/\"\
  > Community erhalten</a>, sodass Benutzer für den Support der Sprachen helfen können.
  Vielen Dank."
features.dnd.desc: "Der Kern von Renewed Tab ist eine Widgetsystem.\nSie können Sachen
  addieren, verschieben, vergrössern, und Widgets konfigurieren, in dem Sie intuitive
  Kontrollen benutzen.\nSie könne das gleiche Widget mehrmals benutzen, mit anderen
  Einstellungen.\n"
features.backgrounds.title: Schöne Hintergrundbilder
