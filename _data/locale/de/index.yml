faq.blur.title: Wie aktiviere ich Verwischen in Firefox?
faq.blur.desc: |
  **Die Unschärfe sollte standardmäßig ab Firefox 103 funktionieren. Stelle sicher, dass du die neuste Version des BrowserS verwendest.

  Möglicherweise lässt sich die Unschärfe in älteren Versionen von Firefox manuell aktivieren:

  1. Öffne einen neuen Tab, gib `about:config` in die Adressleiste ein und drücke Enter.
  2. Akzeptiere die Warnung.
  3. Suche nach `layout.css.backdrop-filter.enabled` und setze den Wert auf `true`, indem du auf das Suchergebnis doppelklickst.
  4. Schließe und öffne Firefox.
faq.bookmarks.title: Wie zeige ich die Lesezeichenleiste nur auf der „Neuer 
  Tab“-Seite?
faq.bookmarks.desc: |
  In Chrome gibt es keine Möglichkeit, die **eingebaute** Lesezeichenleiste nur auf der „Neuer Tab“-Seite anzuzeigen. Stattdessen stellt Renewed Tab eine eigene Lesezeichenleiste bereit. Aktiviere sie über Einstellungen → Allgemein → Lesezeichenleiste.

  In Firefox kannst du es einstellen, indem du neben der Adressleiste rechtsklickst → „Lesezeichen-Symbolleiste“ → „Nur bei neuem Tab anzeigen“

  ![Only show on new tab](/static/images/help/firefox_bookmarks.png)
faq.widgets_outside_grid.title: Wie kann ich Widgets außerhalb des Rasters oder 
  an der Unterkante des Bildschirms platzieren?
faq.widgets_outside_grid.desc: |
  In Renewed Tab müssen alle Widgets im Raster platziert werden. Das ist großartig für die Benutzererfahrung, weil es einfach ist, macht bestimmte Dinge aber etwas komplizierter.

  Damit ein Widget am unteren Rand des Bildschirms angezeigt wird, kannst du das unsichtbare Widget verwenden, um vertikalen Abstand zwischen Widgets hinzuzufügen.
faq.host_permission.title: Warum fragt die Erweiterung nach Leseberechtigungen 
  für alle Daten einer Webseite?
faq.host_permission.desc: |
  Manche Widgets, wie zum Beispiel Feed, müssen Informationen von einer URL laden.
  Webbrowser verfügen über ein sehr striktes Berechtigungssystem, sodass eine Erweiterung Berechtigungen anfragen muss, um bestimmte Dinge zu tun.
  Eine Webseite zu kontaktieren ist eines dieser Dinge.

  Wenn zum Beispiel ein Feed von bbc.co.uk geladen werden soll, benötigt sie die Berechtigung, auf die Daten auf bbc.co.uk zugreifen zu dürfen.

  Renewed Tab liest weder deine persönlichen Informationen, noch den Browserverlauf von den Webseiten auf die du Zugriff erlaubst. Es sendet lediglich Webanfragen an die Webseite, um den Inhalt von dort zu laden.

  Beispielnachrichten:

  >Renewed Tab bittet um zusätzliche Einstellungen
  >Neue Berechtigungen:
  >- Auf ihre Daten für Websites in feeds.bbci.co.uk-Domains zugreifen
faq.background_block.title: Warum erscheint ein Hintergrundbild, obwohl ich es 
  geblockt habe?
faq.background_block.desc: |
  Dem Renewed Tab Schnittstellen-Server stehen zu jedem Zeitpunkt nur 4 Bilder zur Verfügung.
  Solltest du viele Bilder blockiert haben, kann es passieren, dass alle verfügbaren Bilder blockiert sind – ist das der Fall, wird das erste Bild verwendet.

  Der Grund hierfür ist, dass die Unsplash-Schnittstelle nicht zu oft abgefragt werden soll.
faq.no_background.title: Warum erscheint das Hintergrundbild nicht?
faq.no_background.desc: |
  Erweiterungen wie Dark Reader können in Konflikt mit dem Hintergrundbild geraten, du kannst sie je Webseite deaktivieren.

  Alternativ kann es an einem Verbindungsfehler mit der Renewed Tab- oder Unsplash-Schnittstelle oder einem Konfigurationsproblem liegen.
faq.sync.title: Wieso unterstützt ihr keine Browser-Synchronisierung?
faq.sync.desc: |
  Die Synchronisierung von Chrome und Firefox ist auf 8kb pro Eintrag begrenzt. Es ist nicht unüblich für Komponenten wie Notizen, dieses Limit zu überschreiten, wodurch Browser-Synchronisierung unbrauchbar würde.

  Du kannst Einstellungen <i class="fas fa-cog"> → Importieren / Expotieren verwenden, um deine Einstellungen zwischen Browsern zu übertragen.
faq.browser.title: Warum unterstützt ihr nicht Browser XYZ?
faq.browser.desc: |
  Wir unterstützen nur die beiden neuesten Versionen von Firefox und Chrome; es ist sehr schwer, für jeden Browser zu testen und Unterstützung anzubieten.

  Renewed Tab verwendet plattformübergreifende Technologien, sodass es durchaus möglich ist, dass es in deinem Browser trotz mangelnder Unterstützung funktioniert.

  Du kannst .zip-Dateien der Erweiterung so herunterladen:

  1. Rufe die Seite [GitLab pipelines](https://gitlab.com/renewedtab/renewedtab/-/pipelines) auf.
  2. Finde den sogenannten „commit“, an dem du Interesse hast; normalerweise möchtest du einen Veröffentlichungs-Commit wie z.B. „Release 1.2.3“.
  3. Klicke den Download-Knopf (<i class="tag fas fa-ellipsis-v">
  </i>) rechts in der Spalte.
  4. Wähle "Download webext:archive artifact".

  Wenn du ein Problem mit einem nicht unterstützten Browser hast, können wir höchstwahrscheinlich nicht weiterhelfen. Aber wir akzeptieren trotzdem Patches/PRs, um Probleme in nicht unterstützten Browsern zu beheben, solange sie keine strukturellen Probleme hervorrufen oder daran liegen, dass der Browser Webstandards nicht richtig implementiert.
faq.proxy.title: Warum erhalte ich eine Fehlermeldung, wenn ich eine 
  benutzerdefinierte URL in der Web-Version eingebe?
faq.proxy.desc: |
  Wenn du in der Web-Veresion eine benutzerdefinierte URL eingibst, die nicht erlaubt ist, erhältst du die folgende Fehlermeldung:

  > Accessing host example.com is not allowed on the web version. For
  > security reasons, the web version may only access pre-approved domains.
  > Consider using the Chrome/Firefox extension instead.

  Die Web-Version verwendet zum Zugreifen auf URLs einen Proxy, anstatt sie direkt zu kontaktieren. Das ist so, damit [Cross Origin Resource Sharing](https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS)-Einschränkungen (CORS) umgangen werden können: Webseiten dürfen keine Anfragen an andere Webseiten verschicken, solange diese Webseite das nicht erlaubt.

  Der Proxy der Web-Version schränkt die erlaubten Domänen aus [Sicherheitsgründen](https://owasp.org/www-community/attacks/Server_Side_Request_Forgery) ein. Denn wenn alle Domänen erlaubt wären, könnten bösartige Nutzer DNS-Einträge verändern, um auf interne Dienste auf dem Server zuzugreifen.

   Möglicherweise kannst du beantragen, dass eine Webseite vom Proxy zugelassen wird. Du solltest stattdessen aber lieber die Chrome/Firefox-Erweiterung verwenden, da sie diese Einschränkung nicht hat.

  Hinweis: Solltest du die Fehlermeldung beim Verwenden der Browser-Erweiterung erhalten, dann ist etwas _schief gelaufen_. Bitte melde es unten.
