features.backgrounds.desc: |
  Alle 15 Minuten wird ein zufälliges Hintergrundbild aus einer kuratierten Sammlung angezeigt.

  Du kannst auch eine Farbe, eine Unsplash-Sammlung, einen RSS-/Atom-Feed oder ein benutzerdefiniertes Hintergrundbild auswählen.

  Wenn du auf die Quellenangabe zeigst, werden die Widgets versteckt und du kannst das Bild positiv bewerten oder überspringen.
