features.dnd.desc: "Основой Renewed Tab является система виджетов.\n Вы можете добавлять,
  перемещать, изменять размер и\n настраивать виджеты на сетке с помощью интуитивных\n\
  \ элементов управления.\n\nВы можете разместить несколько виджетов одного типа с
  разными настройками.\n"
features.backgrounds.title: Красивые фоны
features.backgrounds.desc: "Смотрите случайно подобранный фон каждые 15 минут.\n\n\
  Вы также можете выбрать сплошной цвет,\nколлекцию Unsplash,\nRSS/Atom ленту или
  изображение фона по своему выбору.\n\nВы можете скрыть виджеты, наведя курсор на
  кредитные строки,\nа также лайкнуть и пропустить изображения.\n"
features.rich.title: Богатые виджеты
features.rich.desc: "Некоторые виджеты подключаются к Интернету. Например, вы можете
  просматривать\nRSS/Atom-канал, узнавать о предстоящих космических запусках и проверять
  погоду.\n\n<a href=\"#widgets\" class=\"button is-primary\">Список виджетов</a>\n"
features.customisable.title: Настраиваемый
features.customisable.desc: "Каждый виджет имеет настройки поведения и темы.\n\nТакже
  есть глобальные настройки, позволяющие настраивать тему,\nизменять язык или выбирать
  фон.\n"
features.foss.title: Бесплатный и с открытым исходным кодом
features.foss.desc: "Каждый может читать код, изменять его и участвовать в разработке.\n\
  \nНаписано с использованием TypeScript и React.\n\n<a href=\"https://gitlab.com/renewedtab/renewedtab\"\
  \ class=\"button is-primary\">\n <i class=\"fab fa-gitlab mr-2\"></i>\n GitLab\n\
  </a>\n<a href=\"https://github.com/rubenwardy/renewedtab\" class=\"button\">\n <i
  class=\"fab fa-github mr-2\"></i>\n GitHub (зеркало)\n</a>\n"
features.locale.title: Многоязычный
features.locale.desc: "Renewed Tab поддерживает английский, французский, испанский,
  немецкий, итальянский, русский, 汉语,\nPortuguês, Bahasa Melayu и тюркский.\n\nПереводы
  поддерживаются сообществом, что позволяет вам добавлять поддержку вашего языка\n\
  .\n\n<a class=\"button is-primary\" href=\"https://renewedtab.com/translations/\"\
  >\n <i class=\"fas fa-language mr-2\"></i>\n Помогите перевести\n</a>.\n"
features.privacy.title: Ориентированность на конфиденциальность
features.privacy.desc: "Мы требуем только минимальные разрешения; другие разрешения\n\
  являются необязательными и запрашиваются только в случае необходимости. Все ваши
  данные на сайте\nхранятся в вашем браузере, а не на наших серверах.\n\n<a class=\"\
  button is-primary\" href=\"/privacy_policy/\">\n Политика конфиденциальности\n</a>.\n"
features.privacy.desc.store: "Мы требуем только минимальные разрешения; другие разрешения\n\
  являются необязательными и запрашиваются только в случае необходимости. Все ваши
  данные\nхранятся в вашем браузере, а не на наших серверах.\n"
