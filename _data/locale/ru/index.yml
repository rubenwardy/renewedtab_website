faq.blur.title: Как включить размытие в Firefox?
faq.blur.desc: "**По умолчанию размытие должно работать в Firefox 103. Убедитесь,
  что ваш браузер\nобновлен.**.\n\nВозможно, в старых версиях Firefox размытие можно
  включить вручную\n:\n\n1. Откройте новую вкладку и введите в качестве адреса `about:config`.\n\
  2. Примите предупреждение.\n3. Включите `layout.css.backdrop-filter.enabled`.\n\
  4. Закройте и снова откройте Firefox.\n"
faq.bookmarks.title: Как показать панель закладок только на странице «Новая 
  вкладка»?
faq.bookmarks.desc: "В Chrome нет возможности отобразить **установленную** панель
  закладок, только\nна странице «Новая вкладка». Однако обновленная вкладка предоставляет
  свою собственную панель закладок, которую\nможно включить, перейдя в Настройки >
  Общие > Панель закладок.\n\nВ Firefox вы можете щелкнуть правой кнопкой мыши рядом
  с адресной строкой > Панель закладок >\nПоказывать только на новой вкладке.\n\n\
  ![Показывать только на новой вкладке](/static/images/help/firefox_bookmarks.png)\n"
faq.widgets_outside_grid.title: Как разместить виджеты за пределами сетки / в 
  нижней части экрана?
faq.widgets_outside_grid.desc: "Обновленная вкладка требует, чтобы все виджеты были
  размещены на сетке. Это отлично подходит для\nUser Experience, так как это просто,
  но усложняет выполнение некоторых действий.\n\nЧтобы виджеты казались расположенными
  в нижней части экрана, можно использовать виджет\nInvisible, чтобы добавить вертикальный
  интервал между виджетами.\n"
faq.host_permission.title: Почему расширение запрашивает чтение всех данных для 
  веб-сайта?
faq.host_permission.desc: "Некоторые виджеты, например Feed, требуют загрузки информации
  с URL-адреса.\nВеб-браузеры, как правило, имеют строгую систему разрешений, поэтому
  расширение браузера\nдолжно запрашивать разрешение на выполнение определенных действий.\n\
  Обращение к веб-сайту - одна из таких вещей.\n\nНапример, чтобы загрузить ленту
  новостей с сайта bbc.ru, расширение должно получить разрешение на доступ к сайту
  bbc.ru по адресу\n.\n\nRenewed Tab не считывает вашу личную информацию или историю
  посещений сайтов\n, к которым вы предоставляете доступ. Оно просто делает веб-запрос
  на сайт, чтобы загрузить содержимое\n.\n\nПримеры сообщений:\n\n> \"Renewed Tab\"\
  \ запросил дополнительные разрешения.\\\\\\\n> Это может:\n> - Читать и изменять
  ваши данные на сайте feeds.bbci.co.uk.\n\n> «Обновленная вкладка» запрашивает дополнительные
  разрешения.\\\\\\\n> Она хочет:\n> - Получить доступ к вашим данным на feeds.bbci.co.uk\n"
faq.background_block.title: Почему фон, который я заблокировал, все равно 
  появляется?
faq.background_block.desc: "На сервере API Renewed Tab одновременно доступно только
  4 изображения.\nЕсли вы заблокировали много изображений, то возможно, что в итоге\n\
  все доступные изображения будут заблокированы - в этом случае будет использовано
  первое изображение\n.\n\nЭто сделано для того, чтобы избежать чрезмерной нагрузки
  на API Unsplash.\n"
faq.no_background.title: Почему не отображается фоновое изображение?
faq.no_background.desc: "Такие расширения, как DarkReader, могут конфликтовать с фоновым
  изображением, вы можете\nотключить его на каждом сайте.\n\nКроме того, это может
  быть проблема соединения с API Renewed Tab или unsplash,\nили проблема конфигурации.\n"
faq.sync.title: Почему вы не поддерживаете синхронизацию браузеров?
faq.sync.desc: "Синхронизация в Chrome и Firefox ограничена 8 КБ на ключ. Обычно такие
  компоненты, как заметки\n, превышают этот лимит, что делает их непрактичными для
  поддержки синхронизации.\n\nВы можете использовать Настройки (<i class=\"fas fa-cog\"\
  ></i>) > Импорт / Экспорт, чтобы обмениваться\nсвоими настройками между браузерами.\n"
faq.browser.title: Почему вы не поддерживаете браузер X?
faq.browser.desc: "Мы поддерживаем только 2 последние версии Firefox и Chrome; сложно
  протестировать\nи обеспечить поддержку всех браузеров.\n\nRenewed Tab создан с использованием
  кросс-платформенных технологий, а это значит, что, скорее всего,\nбудет работать
  в вашем браузере, несмотря на отсутствие поддержки.\n\nВы можете скачать .zips расширения
  для браузера:\n\n1. Перейдите на страницу [GitLab pipelines](https://gitlab.com/renewedtab/renewedtab/-/pipelines).\n\
  2. Найдите интересующий вас коммит. Обычно вам нужен релизный коммит\n, например
  \"Release 1.2.3\".\n3. Нажмите кнопку загрузки (<i class=\"tag fas fa-ellipsis-v\"\
  ></i>) справа от строки.\n4. Выберите \"Загрузить артефакт webext:archive\".\n\n\
  Если у вас проблема с неподдерживаемым браузером, то мы вряд ли сможем\nпомочь.
  Однако мы можем принять исправления/PR для устранения проблем на неподдерживаемых
  платформах\n, если это не влечет за собой архитектурных проблем, а проблема\nне
  связана с неправильной реализацией браузером веб-стандартов.\n"
faq.proxy.title: Почему я получаю ошибку при вводе пользовательского URL в 
  веб-версии?
faq.proxy.desc: "Если вы попытаетесь ввести пользовательский URL, который не разрешен
  в веб-версии, вы\nполучите следующую ошибку:\n\n> Доступ к хосту example.com не
  разрешен в веб-версии. По соображениям безопасности\n> веб-версия может получить
  доступ только к предварительно одобренным доменам.\n> Вместо этого используйте расширение
  Chrome/Firefox.\n\nВеб-версия использует прокси для доступа к URL-адресам, а не
  обращается к ним напрямую\n. Это делается для того, чтобы обойти ограничения\n[Cross
  Origin Resource Sharing](https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS)\n\
  (CORS): веб-страницы не могут делать запросы к другим сайтам без разрешения\nдругого
  сайта.\n\nПрокси веб-версии ограничивают домены, которые вы можете использовать
  по\n[соображениям безопасности](https://owasp.org/www-community/attacks/Server_Side_Request_Forgery).\n\
  Если бы был разрешен любой домен, злоумышленники могли бы изменять записи DNS, чтобы
  разрешить\nдоступ к внутренним службам сервера.\n\nВозможно, вы сможете попросить
  прокси-сервер разрешить доступ к какому-либо сайту. Однако вам\nследует использовать
  расширение Chrome/Firefox, так как оно не имеет этого\nограничения.\n\nПримечание:
  Если вы получаете ошибку при использовании расширения браузера, значит, что-то\n\
  _неправильно_. Пожалуйста, сообщите об этом ниже.\n"
faq.custom_widgets.title: Как добавить пользовательские виджеты?
faq.custom_widgets.desc: "Смотрите [Создание собственных пользовательских виджетов
  для обновленной вкладки](/blog/2022/07/24/custom-widgets/).\n"
faq.contact.title: Как я могу связаться с вами?
faq.contact.desc: "Для обсуждения ошибок и пожеланий по функционалу\nRenewed Tab лучше
  всего создать проблему на трекере проблем.\n\nЕсли вам нужна помощь, вы можете воспользоваться
  любым из этих способов. Discord или Matrix, скорее всего,\nбудут самыми быстрыми.\n"
